# Privacy/secret gate (see scripts/check_privacy.sh).
# gitleaks: generic secret scanning (also enabled for external contributors).
# privacy-denylist: local guard, no-op if .local/privacy-denylist.txt is missing.
# Update the gitleaks rev with: pre-commit autoupdate --repo https://github.com/gitleaks/gitleaks

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: privacy-denylist
        name: privacy denylist
        entry: scripts/check_privacy.sh
        language: script
        exclude: ^\.local/
