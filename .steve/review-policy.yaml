# The mechanism (deterministic path-based tiers, PR tier = max, fail-safe default) is generic and shared across all Steve Agent repos.
# The paths listed below are the per-repo configuration for steve-agent.
# Review policy for steve-agent PRs.
# Triage is deterministic (path matching), not LLM-based.
# Tier of a PR = max(tier of all files it touches).

tiers:
  blast:
    description: "Immediate outage or block of the entire factory"
    paths:
      - "instance/config.yaml"
      - "instance/profiles/*/credentials.mode"
      - ".pre-commit-config.yaml"

  propagation:
    description: "Bug replicated across N installations/future environments"
    paths:
      - "instance/env.template"
      - "instance/SOUL.md"
      - "instance/INSTALL.md"
      - "instance/provision-worker.sh"
      - "instance/backup-kanban.sh"
      - "instance/drift-check.sh"
      - ".steve/**"
      - "tools/**"
      - "scripts/**"
      - ".github/**"
      - "AGENTS.md"  # Context file loaded natively by every worker; changes reach every future task.
      - "CLAUDE.md"  # Context file loaded natively by every worker; changes reach every future task.
      - "SECURITY.md"  # Human-facing but security-relevant; intentionally not auto-mergeable.
      - "README.md"  # Injected into every brief's "Read first" list.
      - ".gitignore"  # Guards which local-only files can enter a commit.

  safe:
    description: "No irreversible damage"
    paths:
      - "docs/**"
      - "instance/README.md"
      - "CONTRIBUTING.md"
      - "CODE_OF_CONDUCT.md"

# Anything not matched defaults to propagation (fail safe, not fast).

rules:
  brief_required_for: [blast, propagation]
  auto_merge: safe             # deterministic GitHub App gate after human authorization
  merge_on: "gate for safe; human on GitHub for propagation and blast"
  revert: manual                # no auto-revert

# ---------------------------------------------------------------------------
# Operational rules for review and fix tasks.
#
# These are not style preferences. Each one cost the factory at least one dead
# task on 2026-07-25, because it lived in whoever wrote the brief rather than
# here, where every brief inherits it.
# ---------------------------------------------------------------------------

task_rules:

  no_file_deletion_in_verifies:
    rule: "Never use rm in any form inside a verify. Not rm -rf, not rm -f, not plain rm."
    why: >-
      The safety gate denies every form, and a dispatched task has no approval
      channel, so the command hangs until the approval timeout and is then
      denied. The task dies with its work unpublished. Cost: four blocked tasks
      in one day.
    instead: >-
      Create fixtures under a fresh mktemp -d and do not clean up; files under
      /tmp are nobody's problem. If an emptiness assertion is wanted, use rmdir,
      which only succeeds on an empty directory and is therefore not destructive.

  review_body_is_public:
    rule: >-
      The text published as a review body goes to GitHub. It must contain no
      instance paths, SSH aliases, hostnames or personal identities. Commands
      may use them; the published prose may not.
    why: >-
      The repository is public. The privacy denylist covers these tokens, so a
      draft containing them fails the privacy check and the reviewer cannot
      publish its verdict, losing the whole review.
    instead: >-
      Refer to them generically ("the instance clone", "a task worktree", "the
      configured alias") and verify the draft with scripts/check_privacy.sh
      before publishing. If it fails, rewrite generically; do not try to inspect
      the matches, as that command is itself denied.

  review_depth_matches_consequence:
    rule: >-
      Decide how deep a review goes from what happens if the thing breaks, not
      from what can still be found by looking harder.
    why: >-
      A configuration change was reviewed as an adversarial security audit for
      six rounds. The findings were real, but the confidentiality property being
      defended protected a local diagnostic script against the operator who
      already has SSH access to the file. Applying the standard of an exposed
      endpoint to a local tool is disproportion, not rigour.
    instead: >-
      State a sufficiency criterion in the brief ("approve if X holds and there
      are no regressions; block only for Y"). When an idea for a further probe
      appears after that bar is met, record it as a non-blocking note instead of
      blocking on it.

  keep_runs_short:
    rule: "Prefer few targeted checks over exhaustive batteries."
    why: >-
      Long runs crash. Dozens of short reviews completed on 2026-07-25; the only
      ones that died were the five- and six-minute exhaustive audits, killed by
      worker crashes unrelated to the code under review. A proportionate review
      is not merely cheaper, it is more likely to reach a verdict at all.
    instead: >-
      Single ordinary commands. If a probe genuinely needs complexity, write it
      to a file and run it as one invocation rather than as a long inline chain.

  verify_the_verifier:
    rule: "An exit code of 0 is not evidence until the check is known to have run."
    why: >-
      A broken check that exits 0 is indistinguishable from a passing one, and
      is more dangerous than no check at all because it manufactures confidence.
      On 2026-07-25 a test extracted its own script with a pattern that matched
      nothing, ran an empty file, exited 0, and read as a pass.
    instead: >-
      Before trusting a green result, confirm the fixture contains what it is
      meant to contain and that the thing under test actually executed.

  new_task_instead_of_unblock:
    rule: >-
      Never unblock a task that will block again. When work has to resume,
      create a NEW task on the same worktree.
    why: >-
      A task that blocked with review-required blocks again the moment it
      resumes. The second block consumes the recurrence limit and raises
      block_loop_detected; a specifier then REWRITES the task's title and body,
      the task is promoted, and the dispatcher answers respawn_guarded with
      reason active_pr from then on. The result is a zombie: ready but never
      spawnable, with the original brief destroyed. Recovering it costs more
      than the work it was carrying.
    instead: >-
      Create a new task with --workspace dir:<worktree of the original task> so
      it works on the same branch and the existing PR updates in place. Record
      the chain with a comment on the parent task.

  privacy_check_needs_arguments:
    rule: >-
      scripts/check_privacy.sh scans only the files passed as arguments. Never
      invoke it with none, and never read its exit 0 as coverage without a
      liveness proof.
    why: >-
      The script loops over "$@". With no arguments the loop never runs and it
      exits 0 without having looked at anything, which is indistinguishable from
      a real pass. A brief prescribed exactly that form the day after
      verify_the_verifier was written into this file. The script now exits 2 on
      a no-argument call, but the rule stands: exit 0 over the wrong file list
      is still a vacuous pass.
    instead: >-
      Pass the changed files explicitly. Pair the real check with a liveness
      proof on a fixture that is known to match, and invoke the script DIRECTLY:
      an exit-code expectation routed through xargs is wrong by construction,
      because xargs remaps a child's 1-125 to 123.

  never_extract_the_code_under_test:
    rule: >-
      A verify never extracts, slices or re-transcribes the code it is testing.
      It runs it.
    why: >-
      Two distinct failures, one cause. Extraction pushes towards composed
      commands (inline Python, regex slicing, long chains) that the safety layer
      holds for approval, and a dispatched task has no approval channel: the
      command is denied after about a minute and the task dies with its work
      unpublished. Extraction also fabricates defects: a reviewer once sliced
      an embedded shell string by hand, lost five statement separators at the
      quote boundaries, parsed the corrupted result and reported the corruption
      as a bug in code that was correct.
    instead: >-
      Run the real thing (the script, its self-test, the function behind a stub)
      with single plain commands, as keep_runs_short already requires. When a
      fixture is needed, prefer a file that already exists over one
      reconstructed from the source.

  self_test_is_the_proof:
    rule: >-
      When the project's own self-test covers a behaviour, the verify is "run
      the self-test and quote the asserting lines", not "now demonstrate it a
      second way".
    why: >-
      The second demonstration is the same proof in a more fragile form. Asking
      for it produced a hand-driven invocation of a pure helper that the safety
      layer denied; the worker correctly stopped without committing, and the
      task delivered nothing the self-test had not already proven.
    instead: >-
      One verify: run the self-test and quote the output of the assertions that
      cover the behaviour. Ask for a second, differently shaped check only
      where the self-test genuinely cannot reach, such as network paths,
      credentials, or anything that only exists after deployment.

  impossible_verify_is_a_brief_defect:
    rule: >-
      A verify that cannot execute is a brief defect, not an obstacle to route
      around. Do not substitute another check. Block, and include the corrected
      verify in the reason.
    why: >-
      A block that only describes the obstacle costs a full round trip: the
      author must derive a correction the worker already knows from the open
      file and neighbouring checks. Three tasks blocked this way in one night;
      two proposed corrections were adopted unchanged, while the third cost an
      extra cycle.
    instead: >-
      Name the cause in one line. Propose the smallest correction that preserves
      the check's strength, and state the property it still proves. Do not run
      it: the worker proposes and the author decides. If every correction would
      weaken the proof, say so instead of proposing one.
