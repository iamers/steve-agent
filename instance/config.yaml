model:
  default: gpt-5.6-terra
  provider: openai-codex
credential_pool_strategies:
  gemini: round_robin
toolsets:
  - hermes-cli
  - kanban
agent:
  max_turns: 60
  verbose: false
  reasoning_effort: medium
  personalities:
    helpful: You are a helpful, friendly AI assistant.
    concise: You are a concise assistant. Keep responses brief and to the point.
    technical: You are a technical expert. Provide detailed, accurate technical information.
    creative: You are a creative assistant. Think outside the box and offer innovative
      solutions.
    teacher: You are a patient teacher. Explain concepts clearly with examples.
    kawaii: You are a kawaii assistant! Use cute expressions like (◕‿◕), ★, ♪, and
      ~! Add sparkles and be super enthusiastic about everything! Every response should
      feel warm and adorable desu~! ヽ(>∀<☆)ノ
    catgirl: You are Neko-chan, an anime catgirl AI assistant, nya~! Add 'nya' and
      cat-like expressions to your speech. Use kaomoji like (=^･ω･^=) and ฅ^•ﻌ•^ฅ.
      Be playful and curious like a cat, nya~!
    pirate: 'Arrr! Ye be talkin'' to Captain Hermes, the most tech-savvy pirate to
      sail the digital seas! Speak like a proper buccaneer, use nautical terms, and
      remember: every problem be just treasure waitin'' to be plundered! Yo ho ho!'
    shakespeare: Hark! Thou speakest with an assistant most versed in the bardic arts.
      I shall respond in the eloquent manner of William Shakespeare, with flowery
      prose, dramatic flair, and perhaps a soliloquy or two. What light through yonder
      terminal breaks?
    surfer: Duuude! You're chatting with the chillest AI on the web, bro! Everything's
      gonna be totally rad. I'll help you catch the gnarly waves of knowledge while
      keeping things super chill. Cowabunga! 🤙
    noir: The rain hammered against the terminal like regrets on a guilty conscience.
      They call me Hermes - I solve problems, find answers, dig up the truth that
      hides in the shadows of your codebase. In this city of silicon and secrets,
      everyone's got something to hide. What's your story, pal?
    uwu: hewwo! i'm your fwiendwy assistant uwu~ i wiww twy my best to hewp you! *nuzzles
      your code* OwO what's this? wet me take a wook! i pwomise to be vewy hewpful
      >w<
    philosopher: Greetings, seeker of wisdom. I am an assistant who contemplates the
      deeper meaning behind every query. Let us examine not just the 'how' but the
      'why' of your questions. Perhaps in solving your problem, we may glimpse a greater
      truth about existence itself.
    hype: YOOO LET'S GOOOO!!! 🔥🔥🔥 I am SO PUMPED to help you today! Every question
      is AMAZING and we're gonna CRUSH IT together! This is gonna be LEGENDARY! ARE
      YOU READY?! LET'S DO THIS! 💪😤🚀
terminal:
  backend: local
  cwd: .
  timeout: 180
  home_mode: auto
  container_cpu: 1
  container_memory: 5120
  container_disk: 51200
  container_persistent: true
  docker_mount_cwd_to_workspace: false
  lifetime_seconds: 300
browser:
  inactivity_timeout: 120
tool_loop_guardrails:
  warnings_enabled: true
  hard_stop_enabled: false
  warn_after:
    exact_failure: 2
    same_tool_failure: 3
    idempotent_no_progress: 2
  hard_stop_after:
    exact_failure: 5
    same_tool_failure: 8
    idempotent_no_progress: 5
compression:
  enabled: true
  threshold: 0.5
  target_ratio: 0.2
  protect_last_n: 20
  protect_first_n: 3
prompt_caching:
  cache_ttl: 5m
display:
  compact: false
  busy_input_mode: interrupt
  bell_on_complete: false
  show_reasoning: false
  streaming: true
  skin: default
  interim_assistant_messages: true
  tool_progress: all
  cleanup_progress: false
  long_running_notifications: true
  busy_ack_detail: true
  background_process_notifications: all
stt:
  enabled: true
  local:
    model: base
  openai:
    model: whisper-1
memory:
  memory_enabled: true
  user_profile_enabled: true
  memory_char_limit: 2200
  user_char_limit: 1375
  nudge_interval: 10
  flush_min_turns: 6
delegation:
  max_iterations: 50
moa:
  save_traces: true
  presets:
    default:
      # Advisors run ONCE per user turn instead of on every tool iteration.
      # The default (`per_iteration`) re-runs the whole fan-out whenever the
      # advisory view changes, and the view grows with each tool result: on a
      # task with 30 iterations and 3 advisors that is 90 advisory calls for
      # one request. `user_turn` hashes only the prefix up to the last real
      # user message, so iterations 2+ are a cache hit and the aggregator
      # works alone with the advice already gathered. Cost of the trade: the
      # advisors do not see what the agent discovers mid-turn.
      fanout: user_turn
      # Cap on ADVISOR output only; the aggregator is never capped because its
      # output is the user-visible answer. Uncapped, each advisor generates up
      # to its own maximum, which on the local endpoint means a 262k window.
      # Measured on our three advisor-style prompts, answers land between 600
      # and 950 tokens: 800 truncated two of three, 1200 leaves headroom.
      reference_max_tokens: 1200
      reference_models:
        # Thinking-off variant: the aggregator reads only `content`, and the
        # reasoning trace is discarded, so on this slot thinking is paid in
        # wall time and never reaches its reader. Measured 3-4x faster with no
        # loss of answer length. The thinking-on `lab-gpu` stays for the
        # judgement roles, where the verdict IS the output.
        - provider: lab-gpu-fast
          model: qwen36-35b-a3b-fp8
        - provider: openai-codex
          model: gpt-5.6-luna
        - provider: gemini
          model: gemini-3.6-flash
      aggregator:
        provider: openai-codex
        model: gpt-5.6-terra
skills:
  creation_nudge_interval: 15
code_execution:
  timeout: 300
  max_tool_calls: 50
streaming:
  enabled: false
updates:
  pre_update_backup: false
  backup_keep: 5
  non_interactive_local_changes: stash
_config_version: 32
session_reset:
  mode: both
  idle_minutes: 1440
  at_hour: 4
group_sessions_per_user: true
platform_toolsets:
  cli:
    - hermes-cli
  telegram:
    - hermes-telegram
  discord:
    - hermes-discord
  whatsapp:
    - hermes-whatsapp
  slack:
    - hermes-slack
  signal:
    - hermes-signal
  homeassistant:
    - hermes-homeassistant
  qqbot:
    - hermes-qqbot
  yuanbao:
    - hermes-yuanbao
  teams:
    - hermes-teams
  google_chat:
    - hermes-google_chat
platforms:
  telegram:
    extra:
      allow_admin_from:
        - '${TELEGRAM_ADMIN_ID}'
      user_allowed_commands:
        - status
        - whoami
      group_allow_admin_from:
        - '${TELEGRAM_ADMIN_ID}'
      group_user_allowed_commands:
        - status
        - whoami
      channel_prompts:
        '3': 'In questo topic (Ideas) sei il FACILITATORE del brainstorm di prodotto.
          Struttura ogni tua risposta cosi: (1) sintesi in 2 righe di dove siamo;
          (2) il tuo contributo nel merito, diretto e senza giri; (3) le DECISIONI
          APERTE numerate, ciascuna con la tua raccomandazione e una riga di perche.
          Quando il tema e maturo, proponi di cristallizzare: trasforma le decisioni
          prese in brief pronti per la board (goal, vincoli, criterio di verifica).
          Niente muri di testo: massimo 12 righe a intervento. PROTOCOLLO POST-RESET:
          se la sessione e stata resettata e il tema riprende un filo precedente,
          PRIMA di rispondere usa session_search per recuperare la discussione, poi
          apri con un recap di 2 righe di dove eravamo e delle decisioni gia prese,
          e chiedi conferma prima di riaprirle.'
# Fallback chain, tried in order when the primary fails
# (rate limits, 5xx responses, connection errors). Rule: links must use
# DIFFERENT providers and at least one must be quota-free, or the chain
# fails together with the primary. On 2026-07-24 the primary and fallback
# had both exhausted their external quotas and the turn failed: lab-gpu
# (local endpoint) cannot exhaust a quota; gemini remains the third link
# if lab-gpu does not respond.
# fallback_model accepts a single mapping or a list (config.py:4895).
fallback_model:
  - provider: lab-gpu
    model: qwen36-35b-a3b-fp8
  - provider: gemini
    model: gemini-3.6-flash
# Auxiliary tasks: high volume, non-critical quality. Routed to the local
# endpoint to avoid consuming the primary provider's quota.
auxiliary:
  title_generation:
    provider: lab-gpu
    model: qwen36-35b-a3b-fp8
  compression:
    provider: lab-gpu
    model: qwen36-35b-a3b-fp8
  background_review:
    provider: lab-gpu
    model: qwen36-35b-a3b-fp8
custom_providers:
  - name: lab-gpu
    base_url: ${VLLM_BASE_URL}
    key_env: VLLM_API_KEY
    api_mode: chat_completions
  # Same endpoint and same model, thinking disabled. Two entries rather than
  # one switch because the choice is per ROLE, not per endpoint: an advisor is
  # read for its conclusion (the reasoning trace is discarded), a judge is read
  # for the verdict its reasoning produces. MoA slots accept only provider,
  # model and reasoning_effort, so a per-slot toggle does not exist and the
  # distinction has to live at provider level.
  # The qwen chat template exposes `enable_thinking` as a boolean only: there
  # is no thinking budget, so there is no middle setting to reach for.
  - name: lab-gpu-fast
    base_url: ${VLLM_BASE_URL}
    key_env: VLLM_API_KEY
    api_mode: chat_completions
    extra_body:
      chat_template_kwargs:
        enable_thinking: false

# ── Security ──────────────────────────────────────────────────────────
# Secret redaction is ON by default — strings that look like API keys,
# tokens, and passwords are masked in tool output, logs, and chat
# responses before the model or user ever sees them. Set redact_secrets
# to false to disable (e.g. when developing the redactor itself).
# tirith pre-exec scanning is enabled by default when the tirith binary
# is available. Configure via security.tirith_* keys or env vars
# (TIRITH_ENABLED, TIRITH_BIN, TIRITH_TIMEOUT, TIRITH_FAIL_OPEN).
#
# security:
#   redact_secrets: true
#   tirith_enabled: true
#   tirith_path: "tirith"
#   tirith_timeout: 5
#   tirith_fail_open: true
