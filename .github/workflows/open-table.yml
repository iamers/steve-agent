# Open Table deliberation-only reducer, event-driven entry point.
#
# This file keeps what is specific to being woken by a comment: the triggers and
# the label guard on the event's issue. What it no longer keeps is the
# concurrency group, which open-table-reduce.yml builds from the number passed
# below, so that this entry point and the periodic sweep resolve to the same
# group for the same session.
#
# It is deliberately not given a `schedule:` key. A scheduled event carries no
# `github.event.issue`, so the guard below would be false and the number passed
# below would be empty: the sweep would be asserted rather than deployed. The
# sweep is open-table-sweep.yml, which enumerates sessions instead of reading
# one off an event.
#
# Protocol decisions live in tools/open-table-reduce.py, not in this workflow.
name: Open Table reducer

on:
  issue_comment:
    types: [created, edited, deleted]
  issues:
    types: [labeled]

permissions:
  issues: write

jobs:
  reduce:
    if: contains(github.event.issue.labels.*.name, 'open-table/session')
    uses: ./.github/workflows/open-table-reduce.yml
    with:
      issue_number: ${{ github.event.issue.number }}
