# One-shot measurement, deleted before this branch opens a pull request.
#
# Three probes the mechanism's record owes, none of which a fixture can answer.
# Woken by a push to this branch because a workflow_dispatch on a file that is
# not on the default branch returns 404: measured, both through `gh workflow
# run` and through the raw dispatches endpoint, against the positive control
# that `gh workflow list` shows only default-branch workflows. The repository
# has done this before, in run 31046339325.
name: probe

on:
  push:
    branches: [feat/detection-periodic-sweep]

jobs:
  # Probes 1 and 2: the workflow token enumerates comment-deletion events on a
  # real session issue, and the count is stable across two reads of an unchanged
  # one. Run through the reduction's own functions rather than a hand-written
  # request, so what is measured is the code that ships. Permissions are exactly
  # what the deployment declares.
  deletion_events:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
      SOURCE_REVISION: ${{ github.sha }}
      LIVE_SESSION: "143"
      DELETION_HAPPENED: "154"
    steps:
      - name: Load the reduction from this branch
        run: |
          curl -fsSLo /tmp/open-table-reduce.py \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${SOURCE_REVISION}/tools/open-table-reduce.py"
      - name: Enumerate deletion events, twice, and the sessions
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util
          import os

          spec = importlib.util.spec_from_file_location("otr", "/tmp/open-table-reduce.py")
          reducer = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(reducer)

          token = os.environ["GITHUB_TOKEN"]
          repository = os.environ["GITHUB_REPOSITORY"]
          live = int(os.environ["LIVE_SESSION"])
          deleted = int(os.environ["DELETION_HAPPENED"])

          # Positive control first: an issue where a deletion actually happened.
          # A zero on the live session alone would be indistinguishable from an
          # enumeration that reads nothing at all.
          control = reducer.deletion_event_count(repository, deleted, token)
          control_again = reducer.deletion_event_count(repository, deleted, token)
          print("PROBE 1 control: #{} comment_deleted = {}".format(deleted, control))
          print("PROBE 1 control: nonzero = {}".format(control > 0))
          # Stability is asserted on the nonzero issue as well as on the live
          # one. Two reads that both return zero are stable in a way a broken
          # enumeration is also stable, so on its own that proves very little.
          print("PROBE 2 control: second read = {}, equal = {}".format(
              control_again, control == control_again))

          first = reducer.deletion_event_count(repository, live, token)
          second = reducer.deletion_event_count(repository, live, token)
          print("PROBE 1 live:    #{} comment_deleted = {}".format(live, first))
          print("PROBE 2 stable:  second read = {}, equal = {}".format(second, first == second))

          sessions = reducer.open_table_sessions(repository, token)
          print("ENUMERATION:     open sessions = {}".format(sessions))
          print("ENUMERATION:     live session enumerated = {}".format(live in sessions))

          failures = []
          if control <= 0:
              failures.append("the enumeration found no deletion where one happened")
          if first != second or control != control_again:
              failures.append("the count disagreed with itself across two reads")
          if live not in sessions:
              failures.append("the enumeration did not reach the live session")
          for failure in failures:
              print("FAILED: " + failure)
          raise SystemExit(1 if failures else 0)
          PY

  # Probe 3, calling half: a group built from a called workflow's input.
  called:
    uses: ./.github/workflows/probe-called.yml
    with:
      key: alpha

  # Probe 3, direct half: the same resolved group, declared by an ordinary job
  # in a different workflow context. If the namespace is repository-wide, these
  # two windows do not overlap.
  direct:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: probe-namespace-${{ github.repository_id }}-alpha
      cancel-in-progress: false
    steps:
      - name: Hold the same group
        run: |
          set -euo pipefail
          printf 'DIRECT  group=probe-namespace-%s-alpha\n' "${GITHUB_REPOSITORY_ID:-unset}"
          printf 'DIRECT  start %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          sleep 40
          printf 'DIRECT  end   %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
