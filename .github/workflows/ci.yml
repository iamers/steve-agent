# CI for iamers/steve-agent
#
# One lightweight job (target < 2 minutes). Seven checks in sequence:
#   1. tools/pr-brief.py self-test (deterministic review triage)
#   2. tools/open-table-validate.py self-test (integrity rules)
#   3. tools/open-table-reduce.py self-test (deliberation-only reducer)
#   4. instance/smoke.sh listener verdict self-test
#   5. syntax check (bash -n) on all tracked shell scripts
#   6. shellcheck at warning severity on the same scripts
#   7. gitleaks (manually downloaded binary, NOT the official action, which
#      requires a license for organizations) on the working copy
#
# Note about check_privacy.sh: in CI it is a no-op by design -- the local
# denylist (secret strings) exists only on the instance and is never committed,
# so there is nothing to compare in CI. Secret/privacy coverage in CI relies
# solely on gitleaks (step 7). check_privacy.sh remains useful as an optional
# local guard on the instance, where the denylist is present.

name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: pr-brief self-test
        run: python3 tools/pr-brief.py --self-test

      - name: Open Table validator self-test
        run: python3 tools/open-table-validate.py --self-test

      - name: Open Table reducer self-test
        run: python3 tools/open-table-reduce.py --self-test

      - name: smoke listener self-test
        run: ./instance/smoke.sh --self-test

      - name: bash syntax check
        run: bash -n instance/*.sh scripts/*.sh

      - name: shellcheck (severity warning)
        # Warning severity. Info-level findings are deliberately dropped:
        # some are intentional patterns (for example, expansion of client-side
        # variables in drift-check.sh SSH commands, where the variable must
        # expand on the remote side rather than locally).
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck --severity=warning instance/*.sh scripts/*.sh

      - name: gitleaks
        # Pinned release binary (NOT the official action, which requires a
        # license for organizations). Download, extract, and run it on the
        # working copy. The 'dir .' scan is sufficient for a shallow checkout.
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          wget -qO /tmp/gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzOf /tmp/gitleaks.tgz gitleaks > gitleaks
          chmod +x gitleaks
          ./gitleaks dir . --no-banner
