# CI per iamers/steve-agent
#
# Job unico e leggero (target < 2 minuti). Cinque controlli in sequenza:
#   1. self-test di tools/pr-brief.py (triage di review deterministico)
#   2. self-test del verdetto listener di instance/smoke.sh
#   3. syntax check (bash -n) su tutti gli script shell tracciati
#   4. shellcheck a severity warning sugli stessi script
#   5. gitleaks (binario scaricato a mano, NON l'action ufficiale che richiede
#      licenza per le organizzazioni) sulla copia di lavoro
#
# Nota su check_privacy.sh: in CI e' no-op by design -- la denylist locale
# (stringhe segrete) vive solo sull'istanza e non e' mai committata, quindi in
# CI non c'e' nulla da confrontare. La copertura secret/privacy in CI e'
# affidata unicamente a gitleaks (step 5). check_privacy.sh resta utile come
# guardia locale opzionale sull'istanza, dove la denylist e' presente.

name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: pr-brief self-test
        run: python3 tools/pr-brief.py --self-test

      - name: smoke listener self-test
        run: ./instance/smoke.sh --self-test

      - name: bash syntax check
        run: bash -n instance/*.sh scripts/*.sh

      - name: shellcheck (severity warning)
        # Severity warning. I finding di livello info sono lasciati cadere di
        # proposito: alcuni sono pattern intenzionali (es. espansione di
        # variabili client-side negli ssh di drift-check.sh, dove la variabile
        # deve espandersi lato remoto e non locale).
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck --severity=warning instance/*.sh scripts/*.sh

      - name: gitleaks
        # Binario release pinnato (NON l'action ufficiale, che richiede licenza
        # per le organizzazioni). Scarica, estrae ed esegue sulla copia di
        # lavoro. La scansione 'dir .' e' sufficiente per un checkout shallow.
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          wget -qO /tmp/gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzOf /tmp/gitleaks.tgz gitleaks > gitleaks
          chmod +x gitleaks
          ./gitleaks dir . --no-banner
