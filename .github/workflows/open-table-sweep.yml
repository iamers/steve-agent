# Open Table periodic sweep, the clock-driven entry point.
#
# The mechanism's second adapter obligation is that the timeline is read
# periodically, independently of incoming comment events, so that detection
# stops depending on the next incorporated message arriving. This file is that
# clock.
#
# PERIOD, which section 2.3 requires this file to state: hourly. That is the
# period requested, and it is NOT a bound on detection latency. Section 2.3
# allows an adapter to claim a bounded window only with the failure model that
# holds it up, and this adapter cannot: it does not own the clock.
#
# Measured on 2026-08-18, six scheduled runs: gaps of 48, 54, 54, 78 and 50
# minutes around a nominal 60, and the declared minute honoured zero times out
# of six. The cron below asks for minute 17 because a cron must ask for some
# minute, not because that minute means anything to the scheduler. GitHub also
# suspends scheduled workflows in repositories with no activity for 60 days, so
# a dormant repository stops sweeping altogether.
#
# `workflow_dispatch` is here so the sweep can be forced without waiting, which
# is the only way to observe it on demand.
name: Open Table periodic sweep

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

jobs:
  enumerate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: read
    outputs:
      sessions: ${{ steps.list.outputs.sessions }}
    env:
      GITHUB_TOKEN: ${{ github.token }}
      SOURCE_REVISION: ${{ github.sha }}
    steps:
      - name: Load the enumeration from the trusted default-branch revision
        # Only the reducer file: `--list-sessions` reads the issues endpoint and
        # touches neither the validator nor the shared core.
        run: |
          curl -fsSLo /tmp/open-table-reduce.py \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${SOURCE_REVISION}/tools/open-table-reduce.py"
      - name: Enumerate the open sessions
        id: list
        # Asked of GitHub rather than kept in a list here: the label is the
        # definition of a session, and a hand-maintained copy would be wrong the
        # moment a session is opened or closed. An empty answer is printed too,
        # because a sweep over nothing must not read as a sweep that ran.
        run: |
          set -euo pipefail
          sessions="$(python3 /tmp/open-table-reduce.py --list-sessions \
            --repository "$GITHUB_REPOSITORY")"
          printf 'enumerated sessions: %s\n' "$sessions"
          printf 'sessions=%s\n' "$sessions" >> "$GITHUB_OUTPUT"

  sweep:
    needs: enumerate
    if: needs.enumerate.outputs.sessions != '' && needs.enumerate.outputs.sessions != '[]'
    permissions:
      issues: write
    strategy:
      fail-fast: false
      matrix:
        issue_number: ${{ fromJSON(needs.enumerate.outputs.sessions) }}
    uses: ./.github/workflows/open-table-reduce.yml
    with:
      issue_number: ${{ matrix.issue_number }}
      periodic: true
